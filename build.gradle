plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = project.mod_group_id
base { archivesName = "${mod_id}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        smokeServer { server(); gameDirectory = file('build/smoke-server'); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.blamejared.com' }
}
dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    def props = [version: project.version, mod_id: mod_id, mod_name: mod_name]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
